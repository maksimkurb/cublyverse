openapi: 3.0.3

info:
  title: Cublyverse API
  version: 0.3.0
  description: |
    HTTP API of the Cublyverse personal assistant.

    The specification is the single source of truth for the HTTP layer: the Go
    server and the TypeScript client are generated from it (`make gen`).

    All operations are served under `/api/v1`. The specification itself is
    available at `/api/openapi.yaml` and rendered at `/api/docs`.

    ## Authentication

    Two transports carry the same kind of opaque session token:

    * `bearerAuth` — the Telegram Mini App receives a token from
      `POST /auth/telegram` and sends it in the `Authorization` header.
    * `cookieAuth` — a browser session created by the `/auth/login` flow; the
      token lives in an `HttpOnly; SameSite=Lax` cookie and never reaches
      JavaScript.

    Session tokens are random 32-byte values; the server stores only their
    sha256 and can revoke them instantly. Mutating requests authenticated with
    the cookie must send `Content-Type: application/json` (CSRF defence on top
    of `SameSite=Lax`).

    ## Personal access tokens

    `Authorization: Bearer cv_pat_…` authenticates a personal access token
    created in the WebApp. A token is limited to its scopes:

    * `profile:read` — `GET /me` (any granted scope also allows it);
    * `reminders:read` — `GET /reminders` and `GET /reminders/{id}`;
    * `reminders:write` — creating, replacing, completing and deleting
      reminders.

    A token may never manage tokens or change the profile: `POST /tokens`,
    `GET /tokens`, `DELETE /tokens/{id}` and `PATCH /me` require a session and
    answer `403` for a token. Unknown, expired and revoked tokens answer `401`,
    exactly like a dead session, and insufficient scopes answer `403` with the
    shared `Error` payload.

    The HTML pages that start a sign-in live under `/auth/*` outside this
    specification; they are documented in `docs/API.md`.

servers:
  - url: /api/v1
    description: Same origin as the WebApp and the messenger links.

tags:
  - name: system
    description: Service metadata and health checks.
  - name: identity
    description: Profile of the signed-in user and their messenger bindings.
  - name: auth
    description: Sessions and Telegram Mini App sign-in.
  - name: reminders
    description: |
      Reminder rules and their occurrences. A rule says what to send when; an
      occurrence is one firing that waits for confirmation and repeats until the
      user confirms it. Every operation is scoped by the session owner.
  - name: tokens
    description: |
      Personal access tokens (PAT). A token authenticates non-browser clients —
      an MCP server, a script, CI — against the same API and the same user data.
      Tokens are managed only from an interactive session: a token can never
      create, list or revoke tokens.

  - name: connections
    description: |
      Applications connected through OAuth (MCP clients such as Claude). Each
      connection is one authorization the user approved on the consent page. The
      list and revocation are available only from an interactive session.
  - name: workspaces
    description: |
      Shared workspaces and their members. A workspace is a named space whose
      members have equal access to its data; one user may belong to several.
      Invitations are direct: a member is added by picking a user who has signed
      in at least once. A workspace is invisible to non-members: an unknown id
      and a foreign one both answer `404`.
  - name: craft
    description: |
      Craft supplies ("Бусинки"): the shared material catalogue, the private
      items of a workspace and its stock. Reference data (categories and
      manufacturers) is global; items created from the WebApp belong to one
      workspace, while items of the shared catalogue are read-only. Every
      operation is scoped by membership in the workspace.

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Service health and version
      description: |
        Reports that the HTTP process is alive together with the build version
        of the running binary. No authentication is required.
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Current user profile and messenger bindings
      description: |
        Returns the SSO profile of the session owner together with every
        verified messenger account. The `id` field is the principal id used by
        the bot, the API and MCP alike.

        A personal access token may read the profile too: every granted scope
        implies `profile:read`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Update the current user's settings
      description: |
        Updates the profile fields a user may change themselves. Only the time
        zone is editable so far.

        A request authenticated with the browser cookie must send
        `Content-Type: application/json`. Together with `SameSite=Lax` this
        prevents cross-site request forgery: a plain HTML form cannot send that
        media type.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: The payload is invalid, for example an unknown time zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Revoke the current session
      description: |
        Revokes the session used for this request and clears the browser cookie.

        The call is idempotent: without a valid session it still answers 204, so
        a client can always drop its local state. A request that was
        authenticated with the cookie must send `Content-Type:
        application/json` — an empty `{}` body is fine.
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The session was revoked, or there was nothing to revoke.
          headers:
            Set-Cookie:
              description: Clears the browser session cookie.
              schema:
                type: string
                example: "cv_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/telegram:
    post:
      operationId: authTelegram
      tags:
        - auth
      summary: Sign in from the Telegram Mini App
      description: |
        Validates the `initData` payload of the Telegram Mini App and exchanges
        it for a session. The signature is an HMAC with the bot token, and
        `auth_date` must be younger than 24 hours.

        * `ok` — the Telegram account is bound to an SSO user; the body carries
          a Bearer token and the profile.
        * `link_required` — the Telegram account has no binding yet; open
          `link_url` inside the Mini App and confirm the binding there.

        The Telegram user id is taken from the signed payload, never from the
        request body, so a client cannot ask for a link to somebody else's
        account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramInitData"
      responses:
        "200":
          description: A session, or the link that starts the binding flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramAuthResponse"
        "400":
          description: The request body is not valid JSON or misses `init_data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The initData signature is invalid, the payload belongs to another bot
            or `auth_date` is too old.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Telegram sign-in is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reminders:
    get:
      operationId: listReminders
      tags:
        - reminders
      summary: List the reminders of the current user
      description: |
        Returns every reminder of the signed-in user, ordered by the local time
        of day and then by creation time. An empty array means the user has no
        reminders.

        Each item carries its pending occurrence, if the reminder has fired and
        is still waiting for confirmation.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: All reminders of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createReminder
      tags:
        - reminders
      summary: Create a reminder
      description: |
        Stores a new reminder rule and computes its first firing from the current
        time. If the time of day has already passed, the first firing is on the
        next matching day, never in the past.

        A disabled reminder is stored without a next due time and can be enabled
        later with `PUT /reminders/{id}`.

        The response is the stored reminder; `active_occurrence` is absent for a
        new reminder.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: The reminder was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: |
            The rule is invalid: the message is empty or longer than 1500
            characters, the time zone is unknown, the time is not `HH:MM`, no
            days are given, a day is out of range for the schedule kind, or the
            repeat interval is outside 1..1440 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reminders/{id}:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    get:
      operationId: getReminder
      tags:
        - reminders
      summary: Get one reminder
      description: |
        Returns a single reminder of the signed-in user. A reminder of another
        user is reported as `404`, exactly like a reminder that does not exist.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateReminder
      tags:
        - reminders
      summary: Replace a reminder
      description: |
        Replaces the whole rule: every field is required, omitted ones are not
        kept. The pending occurrence is cancelled because the old message no
        longer matches what the user asked for, and the next due time is
        computed again from the current time.

        Disabling a reminder (`enabled: false`) cancels the pending occurrence
        and clears the next due time; enabling it computes the nearest future
        occurrence.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReminderRequest"
      responses:
        "200":
          description: The updated reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: The replacement rule is invalid; see `POST /reminders`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReminder
      tags:
        - reminders
      summary: Delete a reminder
      description: |
        Removes the reminder and its occurrence history. The call is not
        idempotent: deleting an already deleted reminder answers `404`.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body, because
        the CSRF rule covers every mutating request.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The reminder was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reminders/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    post:
      operationId: completeReminder
      tags:
        - reminders
      summary: Confirm the pending occurrence
      description: |
        Marks the pending occurrence of the reminder as completed and stops the
        repeats. This is the API and MCP counterpart of the «✅ Выполнено»
        button in the chat, so the same occurrence cannot be confirmed twice
        through different entry points: the state change is one guarded
        statement, and the first request wins.

        The chat message that is waiting for confirmation is updated in place:
        it shows when the reminder was completed and loses the button. A
        messenger failure on that edit is logged and does not affect the
        response.

        The response is the reminder after completion: `active_occurrence` is
        absent because nothing is pending any more.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The reminder after the confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The reminder exists but has no pending occurrence: it has never
            fired, was already confirmed, or an edit cancelled it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tokens:
    get:
      operationId: listTokens
      tags:
        - tokens
      summary: List personal access tokens
      description: |
        Returns every personal access token of the signed-in user, newest first.
        Revoked and expired tokens stay in the list so their state is visible;
        the plaintext secret is never returned.

        Only an interactive session may list tokens: a personal access token
        answers `403` here.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: All tokens of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createToken
      tags:
        - tokens
      summary: Create a personal access token
      description: |
        Issues a new token and returns its plaintext **once**. The server keeps
        only the sha256, so the value cannot be recovered later; a lost token is
        revoked and replaced.

        Scopes are validated against the server registry. `expires_in_days`
        limits the lifetime; omit it (or send `null`) for a token without an
        expiry. Revoking is immediate and works on every replica.

        Only an interactive session may create tokens: a personal access token
        answers `403`, so a leaked token cannot mint another one.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token was created; `token` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          description: |
            The name, the scopes or the lifetime are invalid: the name must be
            1..80 characters, at least one known scope is required and the
            lifetime is 1..365 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeToken
      tags:
        - tokens
      summary: Revoke a personal access token
      description: |
        Revokes the token immediately: every following request with it answers
        `401`. Revoking an already revoked token is a no-op, so a retry after a
        lost response is safe.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /connections:
    get:
      operationId: listConnections
      tags:
        - connections
      summary: List connected applications
      description: |
        Returns the live OAuth authorizations of the signed-in user: applications
        that were allowed access through the consent page and whose refresh token
        has not expired or been revoked, newest first. Only an interactive
        session may call it; a token answers `403`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Connected applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Connection id (UUID). A malformed id is reported as `404`, exactly like
          a connection that does not exist or belongs to another user.
        schema:
          type: string
          example: 9c1b7a52-3d4e-4f60-8a1b-2c3d4e5f6a7b
    delete:
      operationId: revokeConnection
      tags:
        - connections
      summary: Disconnect an application
      description: |
        Revokes every access and refresh token of the authorization at once; the
        application has to ask for consent again.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The application is disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags:
        - workspaces
      summary: List the workspaces of the user
      description: |
        Returns every workspace the signed-in user is a member of, ordered by
        name. A user who has not created or joined one gets an empty list.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Workspaces of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createWorkspace
      tags:
        - workspaces
      summary: Create a workspace
      description: |
        Creates a workspace and makes the signed-in user its first member. A
        user may belong to any number of workspaces.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: The workspace was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: The name is empty or longer than 80 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    patch:
      operationId: renameWorkspace
      tags:
        - workspaces
      summary: Rename a workspace
      description: |
        Changes the name every member sees. Any member may rename a workspace:
        membership is full access.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameWorkspaceRequest"
      responses:
        "200":
          description: The renamed workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: The name is empty or longer than 80 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWorkspace
      tags:
        - workspaces
      summary: Delete a workspace
      description: |
        Deletes the workspace together with its catalogue items, stock and
        projects. Any member may do it. A request authenticated with the browser
        cookie must declare `Content-Type: application/json` even though there is
        no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The workspace is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{id}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listWorkspaceMembers
      tags:
        - workspaces
      summary: List the members of a workspace
      description: |
        Returns everyone who belongs to the workspace, oldest member first.
        Each member carries the Gravatar URL of their e-mail, so the WebApp can
        show an avatar without a separate request.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Members of the workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addWorkspaceMember
      tags:
        - workspaces
      summary: Add a member to a workspace
      description: |
        Adds an existing user to the workspace. The caller must be a member. The
        operation is idempotent: adding someone who is already a member succeeds
        without changing anything.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkspaceMemberRequest"
      responses:
        "204":
          description: The user is a member of the workspace.
        "400":
          description: The request body is missing or has no `user_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The workspace does not exist or the user is not a member of it, or
            the user to add does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/WorkspaceUserID"
    delete:
      operationId: removeWorkspaceMember
      tags:
        - workspaces
      summary: Remove a member from a workspace
      description: |
        Removes a member; a user may remove themselves (leave). The last member
        cannot be removed, because a workspace without members could never be
        managed again: delete the workspace instead. A request authenticated with
        the browser cookie must declare `Content-Type: application/json` even
        though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The user is no longer a member.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The workspace or the member does not exist, or the caller is not a
            member of the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The workspace has only one member left; delete it instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces/{id}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listWorkspaceMemberCandidates
      tags:
        - workspaces
      summary: List users who can be added to a workspace
      description: |
        Returns users who have signed in at least once and are not members of the
        workspace yet. `query` filters by display name or e-mail. The list is
        capped at 50 rows; a shorter search narrows it.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Case-insensitive substring of the display name or e-mail.
          schema:
            type: string
            example: Иван
      responses:
        "200":
          description: Users who can be added.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceCandidate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /craft/categories:
    get:
      operationId: listCraftCategories
      tags:
        - craft
      summary: List material categories
      description: |
        Returns the reference categories of the craft catalogue with their slug,
        Russian name and default unit. They are the same for every workspace.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Material categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /craft/manufacturers:
    get:
      operationId: listCraftManufacturers
      tags:
        - craft
      summary: List manufacturers
      description: |
        Returns the known manufacturers of craft materials. A workspace may also
        create a manufacturer implicitly by naming it in a private item.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Known manufacturers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftManufacturer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workspaces/{id}/catalog:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: searchCraftCatalog
      tags:
        - craft
      summary: Search the catalogue
      description: |
        Searches the shared catalogue and the private items of the workspace.
        Filters combine with AND; an empty filter means "any". `q` matches an
        article prefix or a part of the item or colour name. Every result carries
        the quantity this workspace holds.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug, for example `pearls`.
          schema:
            type: string
            example: pearls
        - name: manufacturer
          in: query
          required: false
          description: Manufacturer name, case-insensitive exact match.
          schema:
            type: string
            example: PRECIOSA
        - name: q
          in: query
          required: false
          description: Article prefix, or part of the item or colour name.
          schema:
            type: string
            example: 11
        - name: only_in_stock
          in: query
          required: false
          description: Keep only items the workspace holds.
          schema:
            type: boolean
            default: false
            example: true
        - name: limit
          in: query
          required: false
          description: Page size, 1..200; the default is 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of matching items to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching catalogue items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCraftItem
      tags:
        - craft
      summary: Create a private catalogue item
      description: |
        Adds a catalogue item visible only in this workspace, for material that is
        in no manufacturer catalogue. The unit defaults to the category default
        unit, and the name defaults to manufacturer plus article. An unknown
        manufacturer name is created.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftItemInput"
      responses:
        "201":
          description: The item was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftItem"
        "400":
          description: |
            A field is invalid: unknown category or unit, empty name, bad colour
            or a duplicate article of the same manufacturer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{id}/catalog/{item_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CraftItemID"
    get:
      operationId: getCraftItem
      tags:
        - craft
      summary: Get a catalogue item
      description: |
        Returns one item visible to the workspace: a global catalogue item or a
        private one. An item of another workspace looks unknown.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The catalogue item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCraftItem
      tags:
        - craft
      summary: Replace a private catalogue item
      description: |
        Replaces every field of a private item; omitted fields are not kept.
        Global catalogue items are read-only and answer `403`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftItemInput"
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftItem"
        "400":
          description: A field is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The item belongs to the shared catalogue and is read-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCraftItem
      tags:
        - craft
      summary: Delete a private catalogue item
      description: |
        Deletes a private item together with its stock. Global catalogue items
        answer `403`. A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The item is deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The item belongs to the shared catalogue and is read-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{id}/catalog/{item_id}/link:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CraftItemID"
    post:
      operationId: linkCraftItem
      tags:
        - craft
      summary: Link a private item to a catalogue item
      description: |
        Moves the stock of a private item to another catalogue item, usually the
        official one found later, and deletes the private item. Quantities are
        summed when the target is already in stock. Units must match.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCraftItemRequest"
      responses:
        "200":
          description: The stock row of the target item after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftStockEntry"
        "400":
          description: The units differ or the item is linked to itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The source item belongs to the shared catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The private item or the target item is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces/{id}/inventory:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listCraftInventory
      tags:
        - craft
      summary: List the stock of a workspace
      description: |
        Returns the stock rows of the workspace with their catalogue item,
        quantity, location and notes. Filters combine with AND. `max_qty` keeps
        rows at or below a threshold, which is how the WebApp finds low stock.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: category
          in: query
          required: false
          description: Category slug, for example `floss`.
          schema:
            type: string
            example: floss
        - name: manufacturer
          in: query
          required: false
          description: Manufacturer name, case-insensitive exact match.
          schema:
            type: string
            example: DMC
        - name: q
          in: query
          required: false
          description: Article prefix, or part of the item or colour name.
          schema:
            type: string
            example: 310
        - name: max_qty
          in: query
          required: false
          description: Keep rows whose quantity is at most this value.
          schema:
            type: number
            format: double
            minimum: 0
            example: 5
        - name: limit
          in: query
          required: false
          description: Page size, 1..200; the default is 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of matching rows to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Stock rows of the workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftStockEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /workspaces/{id}/inventory/{item_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CraftItemID"
    put:
      operationId: setCraftInventoryQty
      tags:
        - craft
      summary: Set the stock of an item
      description: |
        Sets the quantity of an item to an absolute value, as a stocktake does.
        The stock row is created when it does not exist yet. The change is logged
        with the optional reason.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCraftStockRequest"
      responses:
        "200":
          description: The stock row after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftStockEntry"
        "400":
          description: The quantity is negative or not a finite number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCraftInventoryMeta
      tags:
        - craft
      summary: Change where an item is stored
      description: |
        Replaces the location and notes of a stock row. Both fields are sent in
        full; an omitted field is stored as empty.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCraftStockMetaRequest"
      responses:
        "204":
          description: The stock row is updated.
        "400":
          description: The request body is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The item has no stock row in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeCraftInventory
      tags:
        - craft
      summary: Remove an item from stock
      description: |
        Deletes the stock row of an item; the catalogue item itself stays. A
        request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The item is no longer in stock.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The item has no stock row in this workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspaces/{id}/inventory/{item_id}/adjust:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CraftItemID"
    post:
      operationId: adjustCraftInventoryQty
      tags:
        - craft
      summary: Add to or use up stock
      description: |
        Changes the stock of an item by `delta`: positive adds material, negative
        uses it up. The stock row is created on first use. A withdrawal larger
        than the stock is a conflict. The change is logged with the optional
        reason.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustCraftStockRequest"
      responses:
        "200":
          description: The stock row after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftStockEntry"
        "400":
          description: The delta is zero or not a finite number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The withdrawal exceeds the quantity in stock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Either an opaque session token issued by `POST /auth/telegram`, or a
        personal access token created with `POST /tokens` (`cv_pat_…`). Only the
        sha256 of either value is stored on the server. A personal access token
        is limited to its scopes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cv_session
      description: |
        Browser session cookie created by `/auth/login`. It is `HttpOnly`,
        `SameSite=Lax` and `Secure` whenever the public URL is HTTPS.

  parameters:
    ReminderID:
      name: id
      in: path
      required: true
      description: |
        Reminder id (UUID). A malformed id is reported as `404`, exactly like a
        reminder that does not exist.
      schema:
        type: string
        example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c

    TokenID:
      name: id
      in: path
      required: true
      description: |
        Personal access token id (UUID). A malformed id is reported as `404`,
        exactly like a token that does not exist or belongs to another user.
      schema:
        type: string
        example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d

    WorkspaceID:
      name: id
      in: path
      required: true
      description: |
        Workspace id (UUID). A malformed id is reported as `404`, exactly like a
        workspace that does not exist or that the caller does not belong to.
      schema:
        type: string
        example: 44444444-4444-4444-8444-444444444444

    WorkspaceUserID:
      name: user_id
      in: path
      required: true
      description: |
        Id of the user to remove from the workspace. A malformed id is reported
        as `404`, exactly like a user who is not a member.
      schema:
        type: string
        example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c

    CraftItemID:
      name: item_id
      in: path
      required: true
      description: |
        Catalogue item id (UUID). A malformed id is reported as `404`, exactly
        like an item that does not exist or is not visible to the workspace.
      schema:
        type: string
        example: 7d2e5c1a-8b3f-4c6d-9e0a-1b2c3d4e5f60

  schemas:
    APITokenScope:
      type: string
      description: |
        One permission of a personal access token.

        * `profile:read` — read the user's own profile (`GET /me`); it is
          implied by any other granted scope.
        * `reminders:read` — read reminders.
        * `reminders:write` — create, replace, complete and delete reminders.
        * `craft:read` — read the catalogue, stock and wish list of a workspace
          through its MCP endpoint `/mcp/w/{id}`.
        * `craft:write` — change them.

        The registry is extensible: new operations document the scope they
        require.
      enum:
        - profile:read
        - reminders:read
        - reminders:write
        - craft:read
        - craft:write
      example: reminders:write

    Connection:
      type: object
      additionalProperties: false
      description: |
        One OAuth authorization: an application the user allowed to use MCP on
        their behalf.
      required:
        - id
        - client_name
        - workspace_id
        - workspace_name
        - scopes
        - created_at
        - last_used_at
      properties:
        id:
          type: string
          description: Connection id (UUID), used to disconnect the application.
          example: 9c1b7a52-3d4e-4f60-8a1b-2c3d4e5f6a7b
        client_name:
          type: string
          description: Name the application gave itself at registration.
          example: Claude
        workspace_id:
          type: string
          nullable: true
          description: Workspace the application may use, or `null` when none.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        workspace_name:
          type: string
          nullable: true
          description: Name of that workspace, or `null` when there is none.
          example: Дом
        scopes:
          type: array
          description: Permissions the user approved.
          items:
            type: string
            description: One approved scope, for example `craft:read`.
          example: [craft:read, craft:write]
        created_at:
          type: string
          format: date-time
          description: When the user approved the connection.
          example: "2026-01-15T09:30:00Z"
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the application last used its token, or `null`.
          example: "2026-01-16T08:00:00Z"

    APIToken:
      type: object
      additionalProperties: false
      description: |
        A personal access token as stored by the server. The plaintext secret is
        never part of it: only the visible prefix is returned, which is enough
        to recognise the token the user is holding.
      required:
        - id
        - name
        - prefix
        - scopes
        - expires_at
        - last_used_at
        - revoked_at
        - created_at
      properties:
        id:
          type: string
          description: Token id (UUID), used to revoke it.
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: User-facing label chosen at creation.
          example: Claude Code
        prefix:
          type: string
          description: |
            First characters of the token after the `cv_pat_` marker. Shown as
            `cv_pat_<prefix>…` so a user can match a row to a value they hold.
          example: 9xQ2mB7k
        scopes:
          type: array
          minItems: 1
          description: Granted permissions, in registry order.
          items:
            $ref: "#/components/schemas/APITokenScope"
          example: [profile:read, reminders:read]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry, or `null` when the token never expires.
          example: "2026-04-15T09:30:00Z"
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token last authenticated a request; `null` if it was never
            used. Updated at most once per minute to keep authentication a read.
          example: "2026-01-16T08:00:00Z"
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the user revoked the token, or `null` while it works.
          example: null
        created_at:
          type: string
          format: date-time
          description: When the token was issued.
          example: "2026-01-15T09:30:00Z"

    CreateTokenRequest:
      type: object
      additionalProperties: false
      description: Fields of a new personal access token.
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Label shown in the WebApp, for example the client it is meant for.
            Leading and trailing whitespace is trimmed.
          example: Claude Code
        scopes:
          type: array
          minItems: 1
          description: |
            Granted permissions. Duplicates are removed and the order becomes
            the registry order. An unknown scope is rejected with `400`.
          items:
            $ref: "#/components/schemas/APITokenScope"
          example: [profile:read, reminders:read, reminders:write]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: |
            Lifetime in days. Omit it or send `null` for a token without an
            expiry; such a token works until it is revoked.
          example: null

    CreatedToken:
      type: object
      additionalProperties: false
      description: |
        A freshly created token. `token` is the only time the plaintext is
        returned: it is not stored anywhere and cannot be shown again.
      required:
        - token
        - api_token
      properties:
        token:
          type: string
          description: |
            The secret to paste into the client. It starts with `cv_pat_` and
            must be sent as `Authorization: Bearer <token>`.
          example: cv_pat_9xQ2mB7kZ1cR4tY6uI8oP0aS3dF5gH7jK9lM2nB4vC6
        api_token:
          $ref: "#/components/schemas/APIToken"

    Health:
      type: object
      additionalProperties: false
      description: |
        Answer of `GET /api/v1/health`: the process is serving requests and the
        version identifies the running build. The probe endpoints `/healthz`
        and `/readyz` are infrastructure facing and are not part of this
        specification.
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: Always `ok` for a successful response.
          example: ok
        version:
          type: string
          description: Build version of the running binary.
          example: 0.1.0

    Me:
      type: object
      additionalProperties: false
      description: |
        The authenticated user together with the messenger accounts bound to
        them. Bindings are verified: an account only appears here after the user
        confirmed the link, and a Telegram binding additionally requires the
        matching Mini App `initData`.
      required:
        - id
        - timezone
        - created_at
        - bindings
      properties:
        id:
          type: string
          description: Principal id — the `users.id` UUID as a string.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        email:
          type: string
          nullable: true
          description: E-mail from the SSO provider, if it sends one.
          example: user@example.com
        display_name:
          type: string
          nullable: true
          description: Display name from the SSO provider, if it sends one.
          example: Иван Петров
        timezone:
          type: string
          description: |
            IANA time zone used for the user's schedules and notifications.
            Defaults to `UTC` until changed with `PATCH /me`.
          example: Europe/Moscow
        created_at:
          type: string
          format: date-time
          description: When the user row was created.
          example: "2026-01-15T09:30:00Z"
        bindings:
          type: array
          description: Verified messenger accounts of this user.
          items:
            $ref: "#/components/schemas/Binding"

    Binding:
      type: object
      additionalProperties: false
      description: |
        A messenger account linked to an SSO user. A messenger account belongs
        to exactly one user: re-binding moves it, it never duplicates.
      required:
        - platform
        - remote_user_id
        - conversation_id
        - verified_at
      properties:
        platform:
          type: string
          enum:
            - telegram
            - matrix
          description: Messenger of the binding.
          example: telegram
        remote_user_id:
          type: string
          description: User id inside the messenger.
          example: "279058397"
        conversation_id:
          type: string
          description: |
            Chat the bot talks to for this account. For Telegram private chats
            it equals the user id.
          example: "279058397"
        verified_at:
          type: string
          format: date-time
          description: When the user confirmed the binding.
          example: "2026-01-15T09:31:00Z"

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: Fields of the profile a user may change themselves.
      required:
        - timezone
      properties:
        timezone:
          type: string
          description: |
            IANA time zone name, for example `Europe/Moscow`. Unknown names are
            rejected with `400`.
          example: Europe/Moscow

    TelegramInitData:
      type: object
      additionalProperties: false
      description: Raw payload of the Telegram Mini App.
      required:
        - init_data
      properties:
        init_data:
          type: string
          description: |
            The value of `Telegram.WebApp.initData`: a URL-encoded query string
            with a `hash` field. Its HMAC must verify with the bot token and
            `auth_date` must be younger than 24 hours.
          example: query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A279058397%7D&auth_date=1768400000&hash=9f2c1b

    TelegramAuthResponse:
      type: object
      additionalProperties: false
      description: |
        Result of the Mini App sign-in. `status` decides which fields are set:
        `ok` carries a session and the profile, `link_required` carries the
        sign-in link.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - link_required
          description: |
            `ok` — a session was issued; `link_required` — the Telegram account
            is not bound to any SSO user yet.
          example: ok
        token:
          type: string
          description: |
            Bearer session token. Present only for `status: ok`. Keep it in
            memory; it can be revoked by `POST /auth/logout`.
          example: 9lGm2n0bT1cQ4xr8wZ6yV3uK5pJ7hF0aS2dE4gH6jK8
        expires_at:
          type: string
          format: date-time
          description: Expiry of the session. Present only when status is `ok`.
          example: "2026-01-16T09:30:00Z"
        user:
          $ref: "#/components/schemas/Me"
        link_url:
          type: string
          description: |
            Same-origin URL that starts the binding flow: absolute when
            `PUBLIC_BASE_URL` is configured, a relative path otherwise. Present
            only for `status: link_required`. Open it inside the Mini App — the
            webview keeps `initData`, and the server compares that payload with
            the pending binding.
          example: /auth/login?state=Yk3n0bT1cQ4xr8wZ6yV3uK5pJ7hF0aS2dE4gH6jK8

    Error:
      type: object
      additionalProperties: false
      description: |
        Uniform error payload. `code` is a stable machine readable identifier,
        `message` is a human readable explanation in Russian.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code.
          example: not_found
        message:
          type: string
          description: Human readable explanation in Russian.
          example: Страница не найдена

    ScheduleKind:
      type: string
      description: |
        Shape of the schedule.

        * `weekly` — `schedule_days` are ISO weekdays, 1 is Monday and 7 is
          Sunday.
        * `monthly` — `schedule_days` are days of month 1..31. A day the month
          does not have means the last day of that month: 31 is 28 or 29
          February, 31 is 30 April.
      enum:
        - weekly
        - monthly
      example: weekly

    Reminder:
      type: object
      additionalProperties: false
      description: |
        A reminder rule together with the occurrence that waits for
        confirmation, if any.

        The schedule is always interpreted in `timezone`: `time` is the local
        wall clock time, while `next_due_at` is the same moment in UTC.

        A wall clock time that does not exist because the clock jumped forward
        (the spring gap) fires shifted forward by the length of the gap; a wall
        clock time that occurs twice (the autumn overlap) fires once, at the
        first occurrence.
      required:
        - id
        - message
        - timezone
        - schedule_kind
        - schedule_days
        - time
        - repeat_minutes
        - enabled
        - next_due_at
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Reminder id (UUID).
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: |
            Text the user receives, counted in characters (runes). Leading and
            trailing whitespace is trimmed before it is stored.
          example: Выпить таблетку
        timezone:
          type: string
          description: |
            IANA time zone the schedule is interpreted in, for example
            `Europe/Moscow`. `Local` and unknown names are rejected.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            Days of the schedule, sorted and without duplicates. Weekly days are
            1..7 (Monday..Sunday), monthly days are 1..31.
          example: [1, 3, 5]
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM` (24 hours, zero padded).
          example: "09:30"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: |
            How often an unconfirmed occurrence is repeated, in minutes. Every
            repeat replaces the previous message, so only one reminder message
            stays in the chat.
          example: 10
        enabled:
          type: boolean
          description: |
            Whether the reminder is scheduled. A disabled reminder has no
            `next_due_at`.
          example: true
        next_due_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Next firing in UTC, or `null` while the reminder is disabled. The
            scheduler advances it after every firing.
          example: "2026-01-12T06:30:00Z"
        last_error:
          type: string
          nullable: true
          description: |
            Last delivery error, or `null`. It is cleared after the next
            successful delivery.
          example: null
        created_at:
          type: string
          format: date-time
          description: When the reminder was created.
          example: "2026-01-05T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the reminder was last changed.
          example: "2026-01-05T09:00:00Z"
        active_occurrence:
          $ref: "#/components/schemas/ReminderOccurrence"

    ReminderOccurrence:
      type: object
      additionalProperties: false
      description: |
        One firing of a reminder. A reminder has at most one active occurrence at
        a time: the message that was sent and waits for confirmation. While it is
        active the reminder repeats every `repeat_minutes`; completing it or
        editing the rule ends it.
      required:
        - id
        - reminder_id
        - scheduled_at
        - first_sent_at
        - repeat_count
        - next_repeat_at
        - status
        - completed_at
      properties:
        id:
          type: string
          description: Occurrence id (UUID).
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        reminder_id:
          type: string
          description: Reminder that fired.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        scheduled_at:
          type: string
          format: date-time
          description: When the occurrence was due, in UTC.
          example: "2026-01-12T06:30:00Z"
        first_sent_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the first message went out, or `null` before delivery.
          example: "2026-01-12T06:30:01Z"
        repeat_count:
          type: integer
          minimum: 0
          description: |
            How many reminder messages were sent for this occurrence, including
            the first one.
          example: 0
        next_repeat_at:
          type: string
          format: date-time
          nullable: true
          description: When the next repeat is due, in UTC; `null` when done.
          example: "2026-01-12T06:40:01Z"
        status:
          type: string
          description: |
            `active` waits for confirmation, `completed` was confirmed by the
            user, `cancelled` was dropped because the rule changed or was
            disabled.
          enum:
            - active
            - completed
            - cancelled
          example: active
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the user confirmed the occurrence.
          example: null

    CreateReminderRequest:
      type: object
      additionalProperties: false
      description: |
        Fields of a new reminder. `repeat_minutes` defaults to 10 and `enabled`
        to `true`, so the common case needs neither.
      required:
        - message
        - timezone
        - schedule_kind
        - schedule_days
        - time
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: Reminder text, 1..1500 characters.
          example: Выпить таблетку
        timezone:
          type: string
          description: IANA time zone of the schedule.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            At least one day. Weekly days are 1..7, monthly days are 1..31.
          example: [1, 3, 5]
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM`.
          example: "09:30"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 10
          description: Repeat interval of an unconfirmed occurrence.
          example: 10
        enabled:
          type: boolean
          default: true
          description: |
            Create the reminder already scheduled. `false` stores it disabled,
            without a next due time.
          example: true

    UpdateReminderRequest:
      type: object
      additionalProperties: false
      description: |
        The whole rule: `PUT` replaces every field, so all of them are required.
        An omitted field is not kept from the previous version.
      required:
        - message
        - timezone
        - schedule_kind
        - schedule_days
        - time
        - repeat_minutes
        - enabled
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: Reminder text, 1..1500 characters.
          example: Выпить таблетку
        timezone:
          type: string
          description: IANA time zone of the schedule.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            At least one day. Weekly days are 1..7, monthly days are 1..31.
          example: [2, 4]
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM`.
          example: "20:00"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Repeat interval of an unconfirmed occurrence.
          example: 15
        enabled:
          type: boolean
          description: |
            `false` cancels the pending occurrence and clears `next_due_at`.
          example: true

    Workspace:
      type: object
      additionalProperties: false
      description: |
        A shared workspace. Every member has the same rights; data of a
        workspace is visible to its members only.
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: string
          description: Workspace id (UUID), used in every workspace-scoped path.
          example: 44444444-4444-4444-8444-444444444444
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name every member sees.
          example: Дом
        created_at:
          type: string
          format: date-time
          description: When the workspace was created.
          example: "2026-01-15T09:30:00Z"

    WorkspaceMember:
      type: object
      additionalProperties: false
      description: |
        A member of a workspace together with the information the member list
        shows.
      required:
        - user_id
        - display_name
        - email
        - avatar_url
        - joined_at
      properties:
        user_id:
          type: string
          description: Principal id of the member, the same value as `Me.id`.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        display_name:
          type: string
          description: Display name from the SSO provider; empty when unknown.
          example: Иван Петров
        email:
          type: string
          description: E-mail from the SSO provider; empty when unknown.
          example: user@example.com
        avatar_url:
          type: string
          description: |
            Gravatar image of the e-mail; addresses without a Gravatar fall back
            to a generated identicon.
          example: https://www.gravatar.com/avatar/abc?s=96&d=identicon
        joined_at:
          type: string
          format: date-time
          description: When the user joined the workspace.
          example: "2026-01-15T09:30:00Z"

    WorkspaceCandidate:
      type: object
      additionalProperties: false
      description: |
        A user who has signed in at least once and is not a member of the
        workspace yet.
      required:
        - user_id
        - display_name
        - email
        - avatar_url
      properties:
        user_id:
          type: string
          description: Principal id of the user to add.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        display_name:
          type: string
          description: Display name from the SSO provider; empty when unknown.
          example: Иван Петров
        email:
          type: string
          description: E-mail from the SSO provider; empty when unknown.
          example: user@example.com
        avatar_url:
          type: string
          description: Gravatar image of the e-mail, with an identicon fallback.
          example: https://www.gravatar.com/avatar/abc?s=96&d=identicon

    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      description: Name of a new workspace.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Name of the workspace, 1..80 characters. Leading and trailing
            whitespace is trimmed.
          example: Дом

    RenameWorkspaceRequest:
      type: object
      additionalProperties: false
      description: New name of a workspace.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            New name, 1..80 characters. Leading and trailing whitespace is
            trimmed.
          example: Мастерская

    AddWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      description: User to add to a workspace.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: |
            Principal id of a user who has signed in at least once. Adding a
            current member again succeeds without a change.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c

    CraftCategory:
      type: object
      additionalProperties: false
      description: A kind of craft material.
      required:
        - id
        - slug
        - name
        - default_unit
      properties:
        id:
          type: string
          description: Category id (UUID).
          example: 8a3b1c2d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
        slug:
          type: string
          description: Stable slug used in filters and item data.
          example: pearls
        name:
          type: string
          description: Russian name shown to the user.
          example: Жемчуг
        default_unit:
          type: string
          description: |
            Unit an item of this category is counted in when it does not name
            one.
          example: шт

    CraftManufacturer:
      type: object
      additionalProperties: false
      description: A producer of craft material.
      required:
        - id
        - name
        - website
      properties:
        id:
          type: string
          description: Manufacturer id (UUID).
          example: 9b4c2d3e-5f6a-4b7c-8d9e-0f1a2b3c4d5e
        name:
          type: string
          description: Manufacturer name.
          example: PRECIOSA
        website:
          type: string
          description: Manufacturer website; empty when unknown.
          example: https://www.preciosa.com

    CraftItem:
      type: object
      additionalProperties: false
      description: |
        A catalogue entry: either a global item shared by every workspace or a
        private item of one workspace. `stock_qty` and `in_inventory` describe
        what the requested workspace holds.
      required:
        - id
        - workspace_id
        - private
        - category
        - category_name
        - manufacturer
        - article
        - series
        - name
        - color_name
        - color_hex
        - color_source
        - size
        - finish
        - unit
        - pack_size
        - attrs
        - source
        - source_url
        - image_url
        - stock_qty
        - in_inventory
      properties:
        id:
          type: string
          description: Catalogue item id (UUID).
          example: 7d2e5c1a-8b3f-4c6d-9e0a-1b2c3d4e5f60
        workspace_id:
          type: string
          nullable: true
          description: |
            Workspace that owns a private item, or `null` for a global catalogue
            item.
          example: 44444444-4444-4444-8444-444444444444
        private:
          type: boolean
          description: |
            True when the item belongs to this workspace and can be edited or
            deleted; false for a read-only global item.
          example: true
        category:
          type: string
          description: Category slug.
          example: pearls
        category_name:
          type: string
          description: Russian category name.
          example: Жемчуг
        manufacturer:
          type: string
          description: Manufacturer name; empty when none.
          example: PRECIOSA
        article:
          type: string
          description: Manufacturer article number; empty when none.
          example: 111 39 001
        series:
          type: string
          description: Series or variety; empty when none.
          example: Rondelle
        name:
          type: string
          description: Item name.
          example: Жемчуг Майорка айвори 2 мм
        color_name:
          type: string
          description: Colour name; empty when unknown.
          example: айвори
        color_hex:
          type: string
          description: Colour as `#RRGGBB`; empty when unknown.
          example: "#F2E8D5"
        color_source:
          type: string
          description: |
            How trustworthy `color_hex` is: `official` (published by the
            manufacturer), `approx` (estimated) or empty.
          example: approx
        size:
          type: string
          description: Size as free text; empty when unknown.
          example: 2 мм
        finish:
          type: string
          description: Finish or coating as free text; empty when unknown.
          example: матовый
        unit:
          type: string
          description: Unit the quantity is counted in.
          example: шт
        pack_size:
          type: number
          format: double
          nullable: true
          description: |
            How many base units one pack holds, or `null` when unknown or not
            applicable.
          example: 100
        attrs:
          type: object
          additionalProperties: true
          description: |
            Category specific attributes; an empty object when there are none.
          example: {}
        source:
          type: string
          description: |
            Where the row came from: `manual`, a scraper name or an import.
          example: manual
        source_url:
          type: string
          description: Page the data came from; empty for manual items.
          example: ""
        image_url:
          type: string
          description: Product image URL; empty when there is none.
          example: ""
        stock_qty:
          type: number
          format: double
          description: Quantity the workspace holds, in `unit`.
          example: 12
        in_inventory:
          type: boolean
          description: Whether the workspace has a stock row for the item.
          example: true

    CraftItemInput:
      type: object
      additionalProperties: false
      description: |
        Data of a private catalogue item. `PUT` replaces every field, so an
        omitted field is not kept from the previous version.
      required:
        - category
      properties:
        category:
          type: string
          description: Category slug, see `/craft/categories`.
          example: pearls
        manufacturer:
          type: string
          description: Manufacturer name; an unknown name is created.
          example: PRECIOSA
        article:
          type: string
          description: Manufacturer article number.
          example: 111 39 001
        series:
          type: string
          description: Series or variety.
          example: Rondelle
        name:
          type: string
          maxLength: 200
          description: |
            Item name, up to 200 characters. Defaults to the manufacturer and
            the article when omitted.
          example: Жемчуг Майорка айвори 2 мм
        color_name:
          type: string
          description: Colour name.
          example: айвори
        color_hex:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Colour as `#RRGGBB`.
          example: "#F2E8D5"
        color_source:
          type: string
          enum:
            - official
            - approx
          description: |
            How trustworthy the colour is. Defaults to `approx` when
            `color_hex` is set and this field is omitted.
          example: approx
        size:
          type: string
          description: Size as free text.
          example: 2 мм
        finish:
          type: string
          description: Finish or coating as free text.
          example: матовый
        unit:
          type: string
          description: |
            Unit the quantity is counted in. Defaults to the default unit of
            the category.
          example: шт
        pack_size:
          type: number
          format: double
          nullable: true
          description: How many base units one pack holds; must be positive.
          example: 100
        attrs:
          type: object
          additionalProperties: true
          description: Category specific attributes.
          example: {}

    CraftStockEntry:
      type: object
      additionalProperties: false
      description: One stock row of a workspace with its catalogue item.
      required:
        - item
        - qty
        - location
        - notes
        - updated_at
      properties:
        item:
          $ref: "#/components/schemas/CraftItem"
        qty:
          type: number
          format: double
          description: Quantity held, in the unit of the item.
          example: 12
        location:
          type: string
          description: Where the material is stored; empty when unspecified.
          example: Ящик 2
        notes:
          type: string
          description: Free-form notes about this stock; empty when none.
          example: Куплено на ярмарке
        updated_at:
          type: string
          format: date-time
          description: When the stock row last changed.
          example: "2026-01-16T08:00:00Z"

    SetCraftStockRequest:
      type: object
      additionalProperties: false
      description: Absolute quantity of a stocktake.
      required:
        - qty
      properties:
        qty:
          type: number
          format: double
          minimum: 0
          description: New absolute quantity, zero or more.
          example: 12
        reason:
          type: string
          description: Why the quantity changed; stored in the stock log.
          example: Пересчёт

    AdjustCraftStockRequest:
      type: object
      additionalProperties: false
      description: Relative change of the stock.
      required:
        - delta
      properties:
        delta:
          type: number
          format: double
          description: |
            Change of the quantity in the unit of the item: positive adds,
            negative uses up. Zero is rejected.
          example: -1
        reason:
          type: string
          description: Why the quantity changed; stored in the stock log.
          example: Проект «Серьги»

    UpdateCraftStockMetaRequest:
      type: object
      additionalProperties: false
      description: |
        Where a stock row is stored. Both fields are sent in full; a missing
        field is stored as empty.
      required:
        - location
        - notes
      properties:
        location:
          type: string
          description: Where the material is stored.
          example: Ящик 2
        notes:
          type: string
          description: Free-form notes about this stock.
          example: Куплено на ярмарке

    LinkCraftItemRequest:
      type: object
      additionalProperties: false
      description: Target of a link operation.
      required:
        - target_item_id
      properties:
        target_item_id:
          type: string
          description: |
            Catalogue item that receives the stock of the private item. Its unit
            must match the unit of the private item.
          example: 7d2e5c1a-8b3f-4c6d-9e0a-1b2c3d4e5f60

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        No valid session: the header or cookie is missing, the token is unknown,
        expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        The session is valid but the request is not allowed, for example a
        mutating request from a cookie session without a JSON body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: |
        The object does not exist or belongs to another user. Both cases answer
        the same way, so the API cannot be used to discover other users' data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
