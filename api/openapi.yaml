openapi: 3.0.3

info:
  title: Cublyverse API
  version: 0.3.0
  description: |
    HTTP API of the Cublyverse personal assistant.

    The specification is the single source of truth for the HTTP layer: the Go
    server and the TypeScript client are generated from it (`make gen`).

    All operations are served under `/api/v1`. The specification itself is
    available at `/api/openapi.yaml` and rendered at `/api/docs`.

    ## Authentication

    Two transports carry the same kind of opaque session token:

    * `bearerAuth` — the Telegram Mini App receives a token from
      `POST /auth/telegram` and sends it in the `Authorization` header.
    * `cookieAuth` — a browser session created by the `/auth/login` flow; the
      token lives in an `HttpOnly; SameSite=Lax` cookie and never reaches
      JavaScript.

    Session tokens are random 32-byte values; the server stores only their
    sha256 and can revoke them instantly. Mutating requests authenticated with
    the cookie must send `Content-Type: application/json` (CSRF defence on top
    of `SameSite=Lax`).

    ## Personal access tokens

    `Authorization: Bearer cv_pat_…` authenticates a personal access token
    created in the WebApp. A token is limited to its scopes:

    * `profile:read` — `GET /me` (any granted scope also allows it);
    * `reminders:read` — `GET /reminders` and `GET /reminders/{id}`;
    * `reminders:write` — creating, replacing, completing and deleting
      reminders.

    A token may never manage tokens or change the profile: `POST /tokens`,
    `GET /tokens`, `DELETE /tokens/{id}` and `PATCH /me` require a session and
    answer `403` for a token. Unknown, expired and revoked tokens answer `401`,
    exactly like a dead session, and insufficient scopes answer `403` with the
    shared `Error` payload.

    The HTML pages that start a sign-in live under `/auth/*` outside this
    specification; they are documented in `docs/API.md`.

servers:
  - url: /api/v1
    description: Same origin as the WebApp and the messenger links.

tags:
  - name: system
    description: Service metadata and health checks.
  - name: identity
    description: Profile of the signed-in user and their messenger bindings.
  - name: auth
    description: Sessions and Telegram Mini App sign-in.
  - name: reminders
    description: |
      Reminder rules and their occurrences. A rule says what to send when; an
      occurrence is one firing that waits for confirmation and repeats until the
      user confirms it. Every operation is scoped by the session owner.
  - name: tokens
    description: |
      Personal access tokens (PAT). A token authenticates non-browser clients —
      an MCP server, a script, CI — against the same API and the same user data.
      Tokens are managed only from an interactive session: a token can never
      create, list or revoke tokens.

  - name: connections
    description: |
      Applications connected through OAuth (MCP clients such as Claude). Each
      connection is one authorization the user approved on the consent page. The
      list and revocation are available only from an interactive session.

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Service health and version
      description: |
        Reports that the HTTP process is alive together with the build version
        of the running binary. No authentication is required.
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Current user profile and messenger bindings
      description: |
        Returns the SSO profile of the session owner together with every
        verified messenger account. The `id` field is the principal id used by
        the bot, the API and MCP alike.

        A personal access token may read the profile too: every granted scope
        implies `profile:read`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Update the current user's settings
      description: |
        Updates the profile fields a user may change themselves. Only the time
        zone is editable so far.

        A request authenticated with the browser cookie must send
        `Content-Type: application/json`. Together with `SameSite=Lax` this
        prevents cross-site request forgery: a plain HTML form cannot send that
        media type.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: The payload is invalid, for example an unknown time zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Revoke the current session
      description: |
        Revokes the session used for this request and clears the browser cookie.

        The call is idempotent: without a valid session it still answers 204, so
        a client can always drop its local state. A request that was
        authenticated with the cookie must send `Content-Type:
        application/json` — an empty `{}` body is fine.
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The session was revoked, or there was nothing to revoke.
          headers:
            Set-Cookie:
              description: Clears the browser session cookie.
              schema:
                type: string
                example: "cv_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/telegram:
    post:
      operationId: authTelegram
      tags:
        - auth
      summary: Sign in from the Telegram Mini App
      description: |
        Validates the `initData` payload of the Telegram Mini App and exchanges
        it for a session. The signature is an HMAC with the bot token, and
        `auth_date` must be younger than 24 hours.

        * `ok` — the Telegram account is bound to an SSO user; the body carries
          a Bearer token and the profile.
        * `link_required` — the Telegram account has no binding yet; open
          `link_url` inside the Mini App and confirm the binding there.

        The Telegram user id is taken from the signed payload, never from the
        request body, so a client cannot ask for a link to somebody else's
        account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramInitData"
      responses:
        "200":
          description: A session, or the link that starts the binding flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramAuthResponse"
        "400":
          description: The request body is not valid JSON or misses `init_data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The initData signature is invalid, the payload belongs to another bot
            or `auth_date` is too old.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Telegram sign-in is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reminders:
    get:
      operationId: listReminders
      tags:
        - reminders
      summary: List the reminders of the current user
      description: |
        Returns every reminder of the signed-in user, ordered by the local time
        of day and then by creation time. An empty array means the user has no
        reminders.

        Each item carries its pending occurrence, if the reminder has fired and
        is still waiting for confirmation.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: All reminders of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createReminder
      tags:
        - reminders
      summary: Create a reminder
      description: |
        Stores a new reminder rule and computes its first firing from the current
        time. If the time of day has already passed, the first firing is on the
        next matching day, never in the past.

        A disabled reminder is stored without a next due time and can be enabled
        later with `PUT /reminders/{id}`.

        The response is the stored reminder; `active_occurrence` is absent for a
        new reminder.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReminderRequest"
      responses:
        "201":
          description: The reminder was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: |
            The rule is invalid: the message is empty or longer than 1500
            characters, the time zone is unknown, the time is not `HH:MM`, no
            days are given, a day is out of range for the schedule kind, or the
            repeat interval is outside 1..1440 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reminders/{id}:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    get:
      operationId: getReminder
      tags:
        - reminders
      summary: Get one reminder
      description: |
        Returns a single reminder of the signed-in user. A reminder of another
        user is reported as `404`, exactly like a reminder that does not exist.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateReminder
      tags:
        - reminders
      summary: Replace a reminder
      description: |
        Replaces the whole rule: every field is required, omitted ones are not
        kept. The pending occurrence is cancelled because the old message no
        longer matches what the user asked for, and the next due time is
        computed again from the current time.

        Disabling a reminder (`enabled: false`) cancels the pending occurrence
        and clears the next due time; enabling it computes the nearest future
        occurrence.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReminderRequest"
      responses:
        "200":
          description: The updated reminder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: The replacement rule is invalid; see `POST /reminders`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReminder
      tags:
        - reminders
      summary: Delete a reminder
      description: |
        Removes the reminder and its occurrence history. The call is not
        idempotent: deleting an already deleted reminder answers `404`.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body, because
        the CSRF rule covers every mutating request.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The reminder was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reminders/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/ReminderID"
    post:
      operationId: completeReminder
      tags:
        - reminders
      summary: Confirm the pending occurrence
      description: |
        Marks the pending occurrence of the reminder as completed and stops the
        repeats. This is the API and MCP counterpart of the «✅ Выполнено»
        button in the chat, so the same occurrence cannot be confirmed twice
        through different entry points: the state change is one guarded
        statement, and the first request wins.

        The chat message that is waiting for confirmation is updated in place:
        it shows when the reminder was completed and loses the button. A
        messenger failure on that edit is logged and does not affect the
        response.

        The response is the reminder after completion: `active_occurrence` is
        absent because nothing is pending any more.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The reminder after the confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The reminder exists but has no pending occurrence: it has never
            fired, was already confirmed, or an edit cancelled it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tokens:
    get:
      operationId: listTokens
      tags:
        - tokens
      summary: List personal access tokens
      description: |
        Returns every personal access token of the signed-in user, newest first.
        Revoked and expired tokens stay in the list so their state is visible;
        the plaintext secret is never returned.

        Only an interactive session may list tokens: a personal access token
        answers `403` here.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: All tokens of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createToken
      tags:
        - tokens
      summary: Create a personal access token
      description: |
        Issues a new token and returns its plaintext **once**. The server keeps
        only the sha256, so the value cannot be recovered later; a lost token is
        revoked and replaced.

        Scopes are validated against the server registry. `expires_in_days`
        limits the lifetime; omit it (or send `null`) for a token without an
        expiry. Revoking is immediate and works on every replica.

        Only an interactive session may create tokens: a personal access token
        answers `403`, so a leaked token cannot mint another one.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token was created; `token` is shown only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          description: |
            The name, the scopes or the lifetime are invalid: the name must be
            1..80 characters, at least one known scope is required and the
            lifetime is 1..365 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeToken
      tags:
        - tokens
      summary: Revoke a personal access token
      description: |
        Revokes the token immediately: every following request with it answers
        `401`. Revoking an already revoked token is a no-op, so a retry after a
        lost response is safe.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /connections:
    get:
      operationId: listConnections
      tags:
        - connections
      summary: List connected applications
      description: |
        Returns the live OAuth authorizations of the signed-in user: applications
        that were allowed access through the consent page and whose refresh token
        has not expired or been revoked, newest first. Only an interactive
        session may call it; a token answers `403`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Connected applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Connection id (UUID). A malformed id is reported as `404`, exactly like
          a connection that does not exist or belongs to another user.
        schema:
          type: string
          example: 9c1b7a52-3d4e-4f60-8a1b-2c3d4e5f6a7b
    delete:
      operationId: revokeConnection
      tags:
        - connections
      summary: Disconnect an application
      description: |
        Revokes every access and refresh token of the authorization at once; the
        application has to ask for consent again.

        A request authenticated with the browser cookie must declare
        `Content-Type: application/json` even though there is no body.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: The application is disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Either an opaque session token issued by `POST /auth/telegram`, or a
        personal access token created with `POST /tokens` (`cv_pat_…`). Only the
        sha256 of either value is stored on the server. A personal access token
        is limited to its scopes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cv_session
      description: |
        Browser session cookie created by `/auth/login`. It is `HttpOnly`,
        `SameSite=Lax` and `Secure` whenever the public URL is HTTPS.

  parameters:
    ReminderID:
      name: id
      in: path
      required: true
      description: |
        Reminder id (UUID). A malformed id is reported as `404`, exactly like a
        reminder that does not exist.
      schema:
        type: string
        example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c

    TokenID:
      name: id
      in: path
      required: true
      description: |
        Personal access token id (UUID). A malformed id is reported as `404`,
        exactly like a token that does not exist or belongs to another user.
      schema:
        type: string
        example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d

  schemas:
    APITokenScope:
      type: string
      description: |
        One permission of a personal access token.

        * `profile:read` — read the user's own profile (`GET /me`); it is
          implied by any other granted scope.
        * `reminders:read` — read reminders.
        * `reminders:write` — create, replace, complete and delete reminders.
        * `craft:read` — read the catalogue, stock and wish list of a workspace
          through its MCP endpoint `/mcp/w/{id}`.
        * `craft:write` — change them.

        The registry is extensible: new operations document the scope they
        require.
      enum:
        - profile:read
        - reminders:read
        - reminders:write
        - craft:read
        - craft:write
      example: reminders:write

    Connection:
      type: object
      additionalProperties: false
      description: |
        One OAuth authorization: an application the user allowed to use MCP on
        their behalf.
      required:
        - id
        - client_name
        - workspace_id
        - workspace_name
        - scopes
        - created_at
        - last_used_at
      properties:
        id:
          type: string
          description: Connection id (UUID), used to disconnect the application.
          example: 9c1b7a52-3d4e-4f60-8a1b-2c3d4e5f6a7b
        client_name:
          type: string
          description: Name the application gave itself at registration.
          example: Claude
        workspace_id:
          type: string
          nullable: true
          description: Workspace the application may use, or `null` when none.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        workspace_name:
          type: string
          nullable: true
          description: Name of that workspace, or `null` when there is none.
          example: Дом
        scopes:
          type: array
          description: Permissions the user approved.
          items:
            type: string
            description: One approved scope, for example `craft:read`.
          example: [craft:read, craft:write]
        created_at:
          type: string
          format: date-time
          description: When the user approved the connection.
          example: "2026-01-15T09:30:00Z"
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the application last used its token, or `null`.
          example: "2026-01-16T08:00:00Z"

    APIToken:
      type: object
      additionalProperties: false
      description: |
        A personal access token as stored by the server. The plaintext secret is
        never part of it: only the visible prefix is returned, which is enough
        to recognise the token the user is holding.
      required:
        - id
        - name
        - prefix
        - scopes
        - expires_at
        - last_used_at
        - revoked_at
        - created_at
      properties:
        id:
          type: string
          description: Token id (UUID), used to revoke it.
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: User-facing label chosen at creation.
          example: Claude Code
        prefix:
          type: string
          description: |
            First characters of the token after the `cv_pat_` marker. Shown as
            `cv_pat_<prefix>…` so a user can match a row to a value they hold.
          example: 9xQ2mB7k
        scopes:
          type: array
          minItems: 1
          description: Granted permissions, in registry order.
          items:
            $ref: "#/components/schemas/APITokenScope"
          example: [profile:read, reminders:read]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry, or `null` when the token never expires.
          example: "2026-04-15T09:30:00Z"
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the token last authenticated a request; `null` if it was never
            used. Updated at most once per minute to keep authentication a read.
          example: "2026-01-16T08:00:00Z"
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the user revoked the token, or `null` while it works.
          example: null
        created_at:
          type: string
          format: date-time
          description: When the token was issued.
          example: "2026-01-15T09:30:00Z"

    CreateTokenRequest:
      type: object
      additionalProperties: false
      description: Fields of a new personal access token.
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Label shown in the WebApp, for example the client it is meant for.
            Leading and trailing whitespace is trimmed.
          example: Claude Code
        scopes:
          type: array
          minItems: 1
          description: |
            Granted permissions. Duplicates are removed and the order becomes
            the registry order. An unknown scope is rejected with `400`.
          items:
            $ref: "#/components/schemas/APITokenScope"
          example: [profile:read, reminders:read, reminders:write]
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
          description: |
            Lifetime in days. Omit it or send `null` for a token without an
            expiry; such a token works until it is revoked.
          example: null

    CreatedToken:
      type: object
      additionalProperties: false
      description: |
        A freshly created token. `token` is the only time the plaintext is
        returned: it is not stored anywhere and cannot be shown again.
      required:
        - token
        - api_token
      properties:
        token:
          type: string
          description: |
            The secret to paste into the client. It starts with `cv_pat_` and
            must be sent as `Authorization: Bearer <token>`.
          example: cv_pat_9xQ2mB7kZ1cR4tY6uI8oP0aS3dF5gH7jK9lM2nB4vC6
        api_token:
          $ref: "#/components/schemas/APIToken"

    Health:
      type: object
      additionalProperties: false
      description: |
        Answer of `GET /api/v1/health`: the process is serving requests and the
        version identifies the running build. The probe endpoints `/healthz`
        and `/readyz` are infrastructure facing and are not part of this
        specification.
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: Always `ok` for a successful response.
          example: ok
        version:
          type: string
          description: Build version of the running binary.
          example: 0.1.0

    Me:
      type: object
      additionalProperties: false
      description: |
        The authenticated user together with the messenger accounts bound to
        them. Bindings are verified: an account only appears here after the user
        confirmed the link, and a Telegram binding additionally requires the
        matching Mini App `initData`.
      required:
        - id
        - timezone
        - created_at
        - bindings
      properties:
        id:
          type: string
          description: Principal id — the `users.id` UUID as a string.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        email:
          type: string
          nullable: true
          description: E-mail from the SSO provider, if it sends one.
          example: user@example.com
        display_name:
          type: string
          nullable: true
          description: Display name from the SSO provider, if it sends one.
          example: Иван Петров
        timezone:
          type: string
          description: |
            IANA time zone used for the user's schedules and notifications.
            Defaults to `UTC` until changed with `PATCH /me`.
          example: Europe/Moscow
        created_at:
          type: string
          format: date-time
          description: When the user row was created.
          example: "2026-01-15T09:30:00Z"
        bindings:
          type: array
          description: Verified messenger accounts of this user.
          items:
            $ref: "#/components/schemas/Binding"

    Binding:
      type: object
      additionalProperties: false
      description: |
        A messenger account linked to an SSO user. A messenger account belongs
        to exactly one user: re-binding moves it, it never duplicates.
      required:
        - platform
        - remote_user_id
        - conversation_id
        - verified_at
      properties:
        platform:
          type: string
          enum:
            - telegram
            - matrix
          description: Messenger of the binding.
          example: telegram
        remote_user_id:
          type: string
          description: User id inside the messenger.
          example: "279058397"
        conversation_id:
          type: string
          description: |
            Chat the bot talks to for this account. For Telegram private chats
            it equals the user id.
          example: "279058397"
        verified_at:
          type: string
          format: date-time
          description: When the user confirmed the binding.
          example: "2026-01-15T09:31:00Z"

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: Fields of the profile a user may change themselves.
      required:
        - timezone
      properties:
        timezone:
          type: string
          description: |
            IANA time zone name, for example `Europe/Moscow`. Unknown names are
            rejected with `400`.
          example: Europe/Moscow

    TelegramInitData:
      type: object
      additionalProperties: false
      description: Raw payload of the Telegram Mini App.
      required:
        - init_data
      properties:
        init_data:
          type: string
          description: |
            The value of `Telegram.WebApp.initData`: a URL-encoded query string
            with a `hash` field. Its HMAC must verify with the bot token and
            `auth_date` must be younger than 24 hours.
          example: query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A279058397%7D&auth_date=1768400000&hash=9f2c1b

    TelegramAuthResponse:
      type: object
      additionalProperties: false
      description: |
        Result of the Mini App sign-in. `status` decides which fields are set:
        `ok` carries a session and the profile, `link_required` carries the
        sign-in link.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - link_required
          description: |
            `ok` — a session was issued; `link_required` — the Telegram account
            is not bound to any SSO user yet.
          example: ok
        token:
          type: string
          description: |
            Bearer session token. Present only for `status: ok`. Keep it in
            memory; it can be revoked by `POST /auth/logout`.
          example: 9lGm2n0bT1cQ4xr8wZ6yV3uK5pJ7hF0aS2dE4gH6jK8
        expires_at:
          type: string
          format: date-time
          description: Expiry of the session. Present only when status is `ok`.
          example: "2026-01-16T09:30:00Z"
        user:
          $ref: "#/components/schemas/Me"
        link_url:
          type: string
          description: |
            Same-origin URL that starts the binding flow: absolute when
            `PUBLIC_BASE_URL` is configured, a relative path otherwise. Present
            only for `status: link_required`. Open it inside the Mini App — the
            webview keeps `initData`, and the server compares that payload with
            the pending binding.
          example: /auth/login?state=Yk3n0bT1cQ4xr8wZ6yV3uK5pJ7hF0aS2dE4gH6jK8

    Error:
      type: object
      additionalProperties: false
      description: |
        Uniform error payload. `code` is a stable machine readable identifier,
        `message` is a human readable explanation in Russian.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code.
          example: not_found
        message:
          type: string
          description: Human readable explanation in Russian.
          example: Страница не найдена

    ScheduleKind:
      type: string
      description: |
        Shape of the recurrence.

        * `once` — a single occurrence on `start_date` at `time`; the reminder
          is finished after the occurrence is confirmed.
        * `daily` — every `interval` days (1 means every day) at `time`.
        * `weekly` — every `interval` weeks on `schedule_days`, ISO weekdays 1..7
          (1 = Monday, 7 = Sunday).
        * `monthly` — every `interval` months, either on `schedule_days` (days of
          month 1..31, a day the month does not have means its last day) or on
          the nth weekday given by `month_week_position` and `month_weekday`.
        * `yearly` — every `interval` years on the month and day of `start_date`;
          29 February becomes 28 February in a non-leap year.
      enum:
        - once
        - daily
        - weekly
        - monthly
        - yearly
      example: weekly

    Reminder:
      type: object
      additionalProperties: false
      description: |
        A reminder rule together with the occurrence that waits for
        confirmation, if any.

        The schedule is always interpreted in `timezone`: `time` is the local
        wall clock time, while `next_due_at` is the same moment in UTC.

        A wall clock time that does not exist because the clock jumped forward
        (the spring gap) fires shifted forward by the length of the gap; a wall
        clock time that occurs twice (the autumn overlap) fires once, at the
        first occurrence.
      required:
        - id
        - message
        - timezone
        - schedule_kind
        - schedule_days
        - interval
        - month_week_position
        - month_weekday
        - start_date
        - end_kind
        - end_date
        - end_count
        - occurrences_fired
        - finished
        - finished_at
        - time
        - repeat_minutes
        - enabled
        - next_due_at
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Reminder id (UUID).
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: |
            Text the user receives, counted in characters (runes). Leading and
            trailing whitespace is trimmed before it is stored.
          example: Выпить таблетку
        timezone:
          type: string
          description: |
            IANA time zone the schedule is interpreted in, for example
            `Europe/Moscow`. `Local` and unknown names are rejected.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            Days of a `weekly` or `monthly` day-of-month rule, sorted and without
            duplicates. Weekly days are 1..7 (Monday..Sunday), monthly days are
            1..31. Empty for `once`, `daily`, `yearly` and an nth-weekday
            `monthly` rule.
          example: [1, 3, 5]
        interval:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            Gap between occurrences in units of `schedule_kind`: every N days,
            weeks, months or years. `1` means every day/week/month/year. It is
            always relative to `start_date`; ignored by `once`.
          example: 1
        month_week_position:
          type: integer
          minimum: -1
          maximum: 4
          nullable: true
          description: |
            Position of the weekday in a monthly rule: 1..4 for the first through
            fourth, or -1 for the last one. `null` means the rule uses
            `schedule_days` (days of month) instead.
          example: null
        month_weekday:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: |
            ISO weekday of an nth-weekday monthly rule: 1 is Monday, 7 is Sunday.
            `null` unless `month_week_position` is set.
          example: null
        start_date:
          type: string
          format: date
          description: |
            First possible day of the recurrence as `YYYY-MM-DD` in `timezone`.
            For `once` it is the date of the single occurrence; for `yearly` its
            month and day are the anniversary. A new reminder defaults to today in
            its time zone.
          example: "2026-01-05"
        end_kind:
          type: string
          enum:
            - none
            - until
            - count
          description: |
            How a repeating recurrence stops: `none` repeats forever, `until`
            repeats through `end_date`, `count` repeats `end_count` times in
            total. A `once` reminder always has `none`.
          example: none
        end_date:
          type: string
          format: date
          nullable: true
          description: |
            Last allowed day for `end_kind` `until`, as `YYYY-MM-DD` in
            `timezone`; `null` for the other end kinds.
          example: null
        end_count:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
          description: |
            Total number of occurrences for `end_kind` `count`; `null` for the
            other end kinds.
          example: null
        occurrences_fired:
          type: integer
          minimum: 0
          description: |
            How many occurrences already fired. Editing the rule resets it to 0;
            a `count` end compares it with `end_count`.
          example: 0
        finished:
          type: boolean
          description: |
            Whether a finite recurrence is over: a `once` reminder or one whose
            end date or occurrence count was reached and the last occurrence was
            confirmed. A finished reminder is not scheduled and is shown as
            «завершено».
          example: false
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the last occurrence of a finite recurrence was confirmed, or
            `null` while the reminder still has a future occurrence.
          example: null
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM` (24 hours, zero padded).
          example: "09:30"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: |
            How often an unconfirmed occurrence is repeated, in minutes. Every
            repeat replaces the previous message, so only one reminder message
            stays in the chat.
          example: 10
        enabled:
          type: boolean
          description: |
            Whether the reminder is scheduled. A disabled reminder has no
            `next_due_at`.
          example: true
        next_due_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Next firing in UTC, or `null` while the reminder is disabled. The
            scheduler advances it after every firing.
          example: "2026-01-12T06:30:00Z"
        last_error:
          type: string
          nullable: true
          description: |
            Last delivery error, or `null`. It is cleared after the next
            successful delivery.
          example: null
        created_at:
          type: string
          format: date-time
          description: When the reminder was created.
          example: "2026-01-05T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the reminder was last changed.
          example: "2026-01-05T09:00:00Z"
        active_occurrence:
          $ref: "#/components/schemas/ReminderOccurrence"

    ReminderOccurrence:
      type: object
      additionalProperties: false
      description: |
        One firing of a reminder. A reminder has at most one active occurrence at
        a time: the message that was sent and waits for confirmation. While it is
        active the reminder repeats every `repeat_minutes`; completing it or
        editing the rule ends it.
      required:
        - id
        - reminder_id
        - scheduled_at
        - first_sent_at
        - repeat_count
        - next_repeat_at
        - status
        - completed_at
      properties:
        id:
          type: string
          description: Occurrence id (UUID).
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        reminder_id:
          type: string
          description: Reminder that fired.
          example: 6f1c0a3e-5b9d-4a1f-9c2b-7e8d0f1a2b3c
        scheduled_at:
          type: string
          format: date-time
          description: When the occurrence was due, in UTC.
          example: "2026-01-12T06:30:00Z"
        first_sent_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the first message went out, or `null` before delivery.
          example: "2026-01-12T06:30:01Z"
        repeat_count:
          type: integer
          minimum: 0
          description: |
            How many reminder messages were sent for this occurrence, including
            the first one.
          example: 0
        next_repeat_at:
          type: string
          format: date-time
          nullable: true
          description: When the next repeat is due, in UTC; `null` when done.
          example: "2026-01-12T06:40:01Z"
        status:
          type: string
          description: |
            `active` waits for confirmation, `completed` was confirmed by the
            user, `cancelled` was dropped because the rule changed or was
            disabled.
          enum:
            - active
            - completed
            - cancelled
          example: active
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the user confirmed the occurrence.
          example: null

    CreateReminderRequest:
      type: object
      additionalProperties: false
      description: |
        Fields of a new reminder. `repeat_minutes` defaults to 10, `enabled` to
        `true`, `interval` to 1, `end_kind` to `none` and `start_date` to today
        in `timezone`, so a request that only names `schedule_kind`,
        `schedule_days` and `time` keeps the old weekly/monthly behaviour.
      required:
        - message
        - timezone
        - schedule_kind
        - time
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: Reminder text, 1..1500 characters.
          example: Выпить таблетку
        timezone:
          type: string
          description: IANA time zone of the schedule.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            Days of a `weekly` or `monthly` day-of-month rule. Weekly days are
            1..7, monthly days are 1..31. Omit for `once`, `daily`, `yearly` and
            an nth-weekday `monthly` rule.
          example: [1, 3, 5]
        interval:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: |
            Every N days/weeks/months/years, relative to `start_date`. Omitted
            means 1.
          example: 1
        month_week_position:
          type: integer
          minimum: -1
          maximum: 4
          nullable: true
          description: |
            For a monthly nth-weekday rule: 1..4 for the first through fourth
            weekday, or -1 for the last one. Omit for a day-of-month rule.
          example: null
        month_weekday:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: |
            ISO weekday (1 = Monday, 7 = Sunday) of an nth-weekday monthly rule.
            Required together with `month_week_position`.
          example: null
        start_date:
          type: string
          format: date
          description: |
            First possible day as `YYYY-MM-DD` in `timezone`; the date of a
            `once` reminder and the anniversary of a `yearly` one. Omitted means
            today in `timezone`.
          example: "2026-01-05"
        end_kind:
          type: string
          enum:
            - none
            - until
            - count
          default: none
          description: |
            Stop condition of a repeating rule: never, until `end_date`, or after
            `end_count` occurrences. Omitted means `none`; `once` ignores it.
          example: none
        end_date:
          type: string
          format: date
          nullable: true
          description: Last allowed day for `until`, as `YYYY-MM-DD` in `timezone`.
          example: null
        end_count:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
          description: Total number of occurrences for `count`.
          example: null
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM`.
          example: "09:30"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 10
          description: Repeat interval of an unconfirmed occurrence.
          example: 10
        enabled:
          type: boolean
          default: true
          description: |
            Create the reminder already scheduled. `false` stores it disabled,
            without a next due time.
          example: true

    UpdateReminderRequest:
      type: object
      additionalProperties: false
      description: |
        The whole rule: `PUT` replaces every field, so the rule fields are
        required. Recurrence additions are optional with the same defaults as a
        create: `interval` 1, `end_kind` `none` and `start_date` today in
        `timezone`. Editing the rule resets the fired counter.
      required:
        - message
        - timezone
        - schedule_kind
        - time
        - repeat_minutes
        - enabled
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1500
          description: Reminder text, 1..1500 characters.
          example: Выпить таблетку
        timezone:
          type: string
          description: IANA time zone of the schedule.
          example: Europe/Moscow
        schedule_kind:
          $ref: "#/components/schemas/ScheduleKind"
        schedule_days:
          type: array
          maxItems: 31
          items:
            type: integer
            minimum: 1
            maximum: 31
            description: One ISO weekday (1..7) or one day of month (1..31).
          description: |
            Days of a `weekly` or `monthly` day-of-month rule. Weekly days are
            1..7, monthly days are 1..31. Empty for `once`, `daily`, `yearly` and
            an nth-weekday `monthly` rule.
          example: [2, 4]
        interval:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Every N days/weeks/months/years, relative to `start_date`.
          example: 1
        month_week_position:
          type: integer
          minimum: -1
          maximum: 4
          nullable: true
          description: |
            For a monthly nth-weekday rule: 1..4 or -1 for the last weekday.
          example: null
        month_weekday:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          description: |
            ISO weekday (1 = Monday, 7 = Sunday) of an nth-weekday monthly rule.
          example: null
        start_date:
          type: string
          format: date
          description: |
            First possible day as `YYYY-MM-DD` in `timezone`. Omitted means today
            in `timezone`.
          example: "2026-01-05"
        end_kind:
          type: string
          enum:
            - none
            - until
            - count
          default: none
          description: "Stop condition: never, until `end_date`, or after `end_count`."
          example: none
        end_date:
          type: string
          format: date
          nullable: true
          description: Last allowed day for `until`.
          example: null
        end_count:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
          description: Total number of occurrences for `count`.
          example: null
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local wall clock time as `HH:MM`.
          example: "20:00"
        repeat_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Repeat interval of an unconfirmed occurrence.
          example: 15
        enabled:
          type: boolean
          description: |
            `false` cancels the pending occurrence and clears `next_due_at`.
          example: true

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        No valid session: the header or cookie is missing, the token is unknown,
        expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        The session is valid but the request is not allowed, for example a
        mutating request from a cookie session without a JSON body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: |
        The object does not exist or belongs to another user. Both cases answer
        the same way, so the API cannot be used to discover other users' data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
