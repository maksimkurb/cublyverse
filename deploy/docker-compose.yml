# Production example: PostgreSQL plus the Cublyverse service, meant to sit
# behind a TLS-terminating reverse proxy (Caddy, nginx, Traefik).
#
#   cp deploy/.env.example deploy/.env    # and fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# Every value comes from deploy/.env, which Compose reads next to this file for
# the ${VARIABLE} substitutions below; the application itself receives an
# explicit, complete environment. The proxy is deliberately not part of the
# stack: it terminates TLS and forwards to 127.0.0.1:8080 (see docs/DEPLOY.md
# for a Caddy snippet). PostgreSQL is not published at all.

name: cublyverse

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cublyverse}
      POSTGRES_USER: ${POSTGRES_USER:-cublyverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # Only read while initialising an empty volume: data checksums catch
      # silent corruption. Harmless on an existing volume.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    volumes:
      # Named volume: it survives `docker compose down` and image upgrades.
      # `down -v` deletes the database, so back up first (docs/DEPLOY.md).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The readiness of the app is gated on this healthcheck.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  app:
    # `build` makes the example self-contained; on a server you normally build
    # the image in CI, push it and pin CUBLYVERSE_TAG to the release tag.
    image: cublyverse:${CUBLYVERSE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cublyverse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-cublyverse}?sslmode=disable
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in deploy/.env}
      LOG_FORMAT: json
      # SSO sign-in. Without OIDC_ISSUER the API runs but the bot transports
      # are disabled, because nobody could link an account.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      # Telegram: the same bot token verifies Mini App initData.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Matrix register: empty disables the transport.
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_USERNAME: ${MATRIX_USERNAME:-}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD:-}
      MATRIX_PICKLE_KEY: ${MATRIX_PICKLE_KEY:-}
      # The end-to-end encryption state lives on the appdata volume, not in the
      # container: losing it makes old Matrix messages undecryptable.
      MATRIX_CRYPTO_DB: /data/matrix-crypto.db
      BOT_HANDLER_TIMEOUT: ${BOT_HANDLER_TIMEOUT:-30s}
      REMINDERS_TICK_INTERVAL: ${REMINDERS_TICK_INTERVAL:-15s}
    volumes:
      - appdata:/data
    ports:
      # Loopback only: the reverse proxy is the only public entry point.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # The process stops the HTTP server gracefully within 10 seconds.
    stop_grace_period: 30s

volumes:
  pgdata:
  appdata:
